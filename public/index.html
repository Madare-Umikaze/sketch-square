<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Processing + CheerpJ PoC</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
  <script type="module" src="/js/runner.js"></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <p class="eyebrow">TECHNICAL PROOF OF CONCEPT</p>
        <h1>Processing 4 × CheerpJ</h1>
        <p class="description">Java Mode / JAVA2D のスケッチをブラウザで実行する検証ページです。</p>
      </div>
      <div class="controls">
        <button id="startButton" type="button">実行</button>
        <button id="reloadButton" type="button" class="secondary">プレイヤーを再読み込み</button>
      </div>
    </header>

    <section class="status-panel" aria-live="polite">
      <strong id="statusTitle">未実行</strong>
      <pre id="statusLog">準備ができたら「実行」を押してください。</pre>
    </section>

    <section class="stage-wrap">
      <div id="displayHost" class="stage" aria-label="Processing sketch display">
        <p class="placeholder">ここにProcessingのウィンドウが表示されます。</p>
      </div>
    </section>

    <footer>
      <p>初期対象はProcessing 4.5.2 / Java 17 / JAVA2Dです。P2D・P3D・外部ネイティブライブラリは対象外です。</p>
      <p><a href="https://cheerpj.com/docs/getting-started/Java-app" target="_blank" rel="noreferrer">CheerpJ公式ドキュメント</a></p>
    </footer>
  </main>
</body>
</html>
